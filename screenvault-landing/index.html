                  <span className="inline-flex items-center px-2.5 py-1 rounded-full bg-white/[0.06] text-white/65 text-[11px] font-medium tracking-wide uppercase">
                    {p.label}
                  </span>
                  <div className="mt-5 flex items-baseline gap-1.5">
                    <span className="text-5xl font-semibold tracking-tight text-white leading-none">{p.price}</span>
                    <span className="text-sm text-white/45">/month</span>
                  </div>
                  <p className="mt-3 text-sm text-white/55">{p.sub}</p>

                  <div className="my-6 h-px w-full" style={{ background: "rgba(255,255,255,0.06)" }}></div>

                  <ul className="space-y-3">
                    {p.features.map((f, j) => (
                      <li key={j} className="flex items-start gap-2.5 text-sm text-white/80">
                        <Check />
                        <span className="leading-snug">{f}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="mt-8">
                  <a
                    href={p.cta.href}
                    {...(p.cta.external ? { target: "_blank", rel: "noopener" } : {})}
                    className={
                      p.cta.variant === "solid"
                        ? "flex items-center justify-center w-full h-11 rounded-full bg-blue-500 hover:bg-blue-400 text-white text-sm font-medium transition shadow-[0_0_0_1px_rgba(255,255,255,0.08),0_8px_30px_-12px_rgba(59,130,246,0.7)]"
                        : "flex items-center justify-center w-full h-11 rounded-full border border-white/15 hover:border-white/30 hover:bg-white/[0.04] text-white text-sm font-medium transition"
                    }
                  >
                    {p.cta.text}
                  </a>
                </div>
              </div>
            </div>
          ))}
        </div>

        <p className="mt-10 text-center text-xs text-white/45">
          All plans include Google Drive as your storage layer. We never host or access your video content.
        </p>
      </div>
    </section>
  );
}

// ---------- WAITLIST ----------
function Waitlist() {
  const [email, setEmail] = useState("");
  const [state, setState] = useState("idle");
  const [error, setError] = useState("");

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    const trimmed = email.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
      setError("Please enter a valid email.");
      return;
    }
    setState("submitting");
    try {
      const res = await fetch(`${API_BASE}/waitlist`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: trimmed }),
      });
      if (!res.ok) throw new Error("Server error");
      setState("success");
    } catch (err) {
      setState("error");
      setError("Something went wrong. Try again?");
    }
  };

  return (
    <section id="waitlist" className="border-t border-white/[0.06]">
      <div className="max-w-3xl mx-auto px-6 py-28 text-center">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-white/10 bg-white/[0.03] text-xs text-white/70 mb-6">
          <span className="w-1.5 h-1.5 rounded-full bg-blue-400 rec-dot"></span>
          Beta access — limited spots
        </div>
        <h2 className="text-3xl md:text-5xl font-semibold tracking-tight">Join the waitlist.</h2>
        <p className="mt-4 text-white/55 max-w-lg mx-auto">
          Drop your email and we'll send an invite as soon as a beta seat opens up.
        </p>

        <form onSubmit={handleSubmit} className="mt-10 max-w-md mx-auto">
          {state !== "success" ? (
            <>
              <div className="focus-ring flex items-center gap-2 p-1.5 rounded-full border border-white/10 bg-white/[0.03] transition">
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="you@company.com"
                  className="flex-1 bg-transparent px-4 h-10 text-sm placeholder:text-white/30 text-white"
                  required
                  disabled={state === "submitting"}
                />
                <button
                  type="submit"
                  disabled={state === "submitting"}
                  className="h-10 px-5 rounded-full bg-blue-500 hover:bg-blue-400 disabled:opacity-60 text-sm font-medium transition whitespace-nowrap"
                >
                  {state === "submitting" ? "Joining…" : "Join Waitlist"}
                </button>
              </div>
              {error && <p className="mt-3 text-xs text-red-400">{error}</p>}
              <p className="mt-3 text-xs text-white/40">No spam. One email when your seat is ready.</p>
            </>
          ) : (
            <div className="rounded-2xl card-border bg-white/[0.02] px-6 py-7">
              <div className="mx-auto w-10 h-10 rounded-full bg-blue-500/15 text-blue-400 ring-1 ring-blue-500/30 grid place-items-center mb-3">
                <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M5 12.5l4.5 4.5L19 7.5"/>
                </svg>
              </div>
              <div className="text-lg font-medium">You're on the list!</div>
              <p className="mt-1 text-sm text-white/55">We'll email <span className="text-white/80">{email}</span> as soon as your beta seat is ready.</p>
            </div>
          )}
        </form>
      </div>
    </section>
  );
}
